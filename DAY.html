<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Расписание</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040f2c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Segoe UI Black (если установлен в системе), иначе Open Sans ExtraBold */
@font-face{font-family:"SegBlack";src:local("Segoe UI Black"),local("SegoeUI-Black"),local("Segoe UI Black Regular");font-weight:100 900;font-style:normal}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --mute:rgba(226,240,255,.62);--c:150,170,210;--spring:cubic-bezier(.34,1.45,.64,1);--ease:cubic-bezier(.22,1,.36,1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
button{font:inherit;font-weight:inherit;color:inherit;border:0;background:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
input,textarea{font:inherit;color:inherit}
body{margin:0;min-height:100vh;color:#e2edfb;background:linear-gradient(165deg,#010510 0%,#040f2c 48%,#07295f 100%) fixed;
 font:800 16px/1.35 "SegBlack","Open Sans",Tahoma,Verdana,system-ui,sans-serif;font-feature-settings:"tnum";-webkit-text-size-adjust:100%;overflow-x:hidden}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:300px;height:300px;left:-90px;top:6%;background:#1450c8}
.orbs i:nth-child(2){width:260px;height:260px;right:-80px;top:38%;background:#0f86c2;animation-duration:23s;animation-delay:-6s}
.orbs i:nth-child(3){width:340px;height:340px;left:10%;bottom:-120px;background:#08306e;animation-duration:28s;animation-delay:-11s}
.orbs i:nth-child(4){width:240px;height:240px;right:-60px;top:-50px;background:#5b32c4;opacity:.38;animation-duration:26s;animation-delay:-3s}
@keyframes drift{to{transform:translate(50px,-70px) scale(1.15)}}
main{max-width:520px;margin:0 auto;padding:18px 14px 120px}
.page{display:none}
.page.on{display:block;animation:pageIn .65s var(--spring) both}
@keyframes pageIn{from{opacity:0;transform:translateY(26px) scale(.965)}to{opacity:1;transform:none}}

/* жидкое стекло */
.seg,.strip,.nav button,.pill,.sum div,.les .tx,.empty,.glass{position:relative;overflow:hidden;
 background:linear-gradient(135deg,rgba(140,175,230,.14),rgba(255,255,255,.035));
 border:1px solid rgba(255,255,255,.1);
 -webkit-backdrop-filter:blur(34px) saturate(120%) brightness(.9);backdrop-filter:blur(34px) saturate(120%) brightness(.9);
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.2),inset -1px -1px 0 rgba(255,255,255,.06),inset 0 0 24px rgba(255,255,255,.03),0 14px 34px rgba(0,4,24,.55)}
.seg::before,.strip::before,.nav button::before,.pill::before,.sum div::before,.les .tx::before,.empty::before,.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(130% 90% at var(--x,12%) var(--y,0%),rgba(255,255,255,.11),transparent 55%);transition:background .2s}
.seg>*,.strip>*,.nav button>*,.dock>*{position:relative;z-index:1}
.lens{position:absolute!important;z-index:0!important;top:5px;bottom:5px;left:5px;border-radius:inherit;pointer-events:none;
 background:linear-gradient(135deg,var(--l1,rgba(40,105,225,.62)),var(--l2,rgba(20,130,205,.32)));
 border:1px solid rgba(255,255,255,.22);
 box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset 0 0 14px rgba(255,255,255,.08),0 8px 20px rgba(10,70,190,.5);
 transition:transform .7s var(--spring)}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);border-radius:22px;padding:5px;margin-bottom:10px}
.seg .lens{width:calc((100% - 10px)/var(--n,2));border-radius:17px;transform:translateX(calc(var(--i,0)*100%))}
.seg button{min-height:42px;border-radius:17px;color:var(--mute);font-size:15px;transition:color .35s,transform .35s var(--spring)}
.seg button.on{color:#fff}
.strip{display:grid;grid-template-columns:repeat(6,1fr);border-radius:24px;padding:5px;margin:16px 0 10px}
.strip .lens{width:calc((100% - 10px)/6);border-radius:19px;transform:translateX(calc(var(--i,0)*100%))}
.strip button{min-height:62px;border-radius:19px;text-align:center;padding:8px 0;transition:opacity .35s,transform .3s var(--spring)}
.strip b{display:block;font-size:13px;color:var(--mute);transition:color .3s}
.strip span{font-size:19px;font-variant-numeric:tabular-nums;display:inline-block;transition:transform .5s var(--spring)}
.strip button.off{opacity:.42}
.strip button.sel{opacity:1}.strip button.sel b{color:#fff}.strip button.sel span{transform:scale(1.15)}
.nav{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.nav button{min-height:46px;border-radius:18px;font-size:15px;transition:transform .35s var(--spring),opacity .3s}
.nav button[disabled]{opacity:.35}
button:active:not([disabled]){transform:scale(.93)}
.fullbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:11px 14px;border-radius:22px;text-align:left;
 background:linear-gradient(135deg,rgba(160,110,255,.3),rgba(40,150,230,.16));border-color:rgba(190,160,255,.35);transition:transform .35s var(--spring)}
.fullbtn .pe{--c:178,130,255}
.fullbtn .ft2{flex:1;min-width:0;font-size:17px}.fullbtn small{display:block;font-size:12px;color:var(--mute)}
.fullbtn .arr{font-size:20px;color:#fff;transition:transform .4s var(--spring)}
.fullbtn:active .arr{transform:translateX(5px)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}
.head h2{font-size:25px;margin:0;letter-spacing:-.01em}
.pill{padding:9px 14px 9px 12px;border-radius:99px;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:transform .35s var(--spring)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;position:relative;z-index:1}
.dot.r{background:#ff4d5e;box-shadow:0 0 10px #ff4d5e}.dot.w{background:#fff;box-shadow:0 0 10px #fff}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.sum div{border-radius:22px;padding:11px 13px}
.sum small{color:var(--mute);font-size:13px;position:relative;z-index:1}
.sum b{display:block;font-size:27px;font-variant-numeric:tabular-nums;position:relative;z-index:1;background:linear-gradient(135deg,#f2f8ff,#7fbfe8);-webkit-background-clip:text;background-clip:text;color:transparent}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:64px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(#8fd6ff,#2b7bff 60%,#0b4a96)}
.tl li{display:flex;gap:12px;padding:6px 0;position:relative;animation:rise .7s var(--spring) both;animation-delay:calc(var(--i)*50ms)}
.tl li::after{content:"";position:absolute;left:59px;top:15px;width:12px;height:12px;border-radius:50%;background:#0a2a66;border:2px solid rgb(var(--c));box-shadow:0 0 10px rgba(var(--c),.6)}
.tl li.wake::after,.tl li.go::after,.tl li.les::after,.tl li.lunch::after{background:rgb(var(--c));box-shadow:0 0 14px rgba(var(--c),.8)}
.tm{width:52px;flex:none;text-align:right;font-variant-numeric:tabular-nums;padding-top:11px;font-size:15px}
.tx{flex:1;min-width:0;margin-left:14px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:18px;background:rgba(var(--c),.11);border:1px solid rgba(var(--c),.24);font-size:16px}
.em{margin-right:7px;font-size:18px}
.m{flex:1;min-width:0}.m small{display:block;color:var(--mute);font-size:12.5px}
.end{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13.5px}
.les .tx{border-radius:22px;padding:12px 14px;background:linear-gradient(135deg,rgba(var(--c),.34),rgba(var(--c),.08));border-color:rgba(var(--c),.42)}
.les .tx>*{position:relative;z-index:1}
.les .tx b{font-size:18px}
.n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,rgb(var(--c)),rgba(var(--c),.65));color:#06142f;display:grid;place-items:center;font-size:14px;flex:none;box-shadow:inset 1px 1px 1px rgba(255,255,255,.6),0 4px 12px rgba(var(--c),.45)}
.gap .tx:not(.tap){color:var(--mute);font-size:14.5px;background:none;border-color:transparent;padding:3px 12px}
.empty{border-radius:24px;padding:28px;text-align:center;font-size:20px}
.fwd{animation:inR .65s var(--spring) both}
.back{animation:inL .65s var(--spring) both}
.fade{animation:fade .45s both}
.none,.none *{animation:none!important}
@keyframes inR{from{opacity:0;transform:translateX(64px) scale(.95)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-64px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
li{flex-wrap:wrap}
.tl li{row-gap:0}
.tx.tap{cursor:pointer;transition:background .35s,border-color .35s,transform .4s var(--spring)}
.tx.tap:active{transform:scale(.97)}
li.open .tx.tap{background:rgba(var(--c),.24);border-color:rgba(var(--c),.55)}
.chev{width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translate(-1px,-1px);transition:transform .5s var(--spring);flex:none;margin:0 3px 0 0}
li.open .chev,.openb .chev{transform:rotate(-135deg) translate(-1px,-1px)}
.pop{flex:none;width:calc(100% - 78px);margin-left:78px;display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .55s var(--ease),margin-top .35s,opacity .4s}
.pop>div{overflow:hidden;min-height:0}
li.open .pop{grid-template-rows:1fr;margin-top:8px;opacity:1}
.menu{border-radius:20px;padding:12px;background:linear-gradient(135deg,rgba(120,160,230,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(34px) saturate(120%);backdrop-filter:blur(34px) saturate(120%);box-shadow:inset 1px 1px 0 rgba(255,255,255,.18),0 10px 26px rgba(0,4,24,.5)}
.lab{font-size:13px;color:var(--mute);margin:0 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.tg{margin-top:8px}
.chip{padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:14px;color:var(--mute);transition:background .35s,color .35s,transform .4s var(--spring),box-shadow .35s}
.chip.on{background:rgba(var(--c),.9);color:#06142f;border-color:rgba(255,255,255,.35);box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),0 4px 12px rgba(var(--c),.4)}
.chip:active{transform:scale(.92)}
.tot{margin-top:10px;font-size:13px;color:var(--mute)}

/* значки */
.pe{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none;background:linear-gradient(135deg,rgba(var(--c),.45),rgba(var(--c),.15));border:1px solid rgba(var(--c),.5);box-shadow:inset 1px 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(var(--c),.3)}
.pe.sm{width:36px;height:36px;border-radius:12px;font-size:19px}
.pe.tx2{font-size:14px;color:#fff}

/* док */
.dock{position:fixed!important;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(calc(100% - 28px),492px);
 display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:30px;z-index:20}
.dock .lens{width:calc((100% - 10px)/5);border-radius:25px;transform:translateX(calc(var(--i,0)*100%))}
.dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;padding:6px 0;border-radius:25px;color:var(--mute);font-size:11px;transition:color .35s,transform .35s var(--spring)}
.dock button span{font-size:22px;line-height:1.1;transition:transform .6s var(--spring)}
.dock button.on{color:#fff}.dock button.on span{transform:translateY(-2px) scale(1.22)}

/* полное расписание */
.sheet{position:fixed;inset:0;z-index:60;visibility:hidden;pointer-events:none;transition:visibility 0s .65s}
.sheet.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.scrim{position:absolute;inset:0;background:rgba(1,5,20,.62);opacity:0;transition:opacity .55s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet.open .scrim{opacity:1}
.panel{position:absolute;left:50%;bottom:0;width:min(100%,560px);max-height:93vh;overflow-y:auto;overscroll-behavior:contain;transform:translate(-50%,106%);transition:transform .7s var(--ease);
 padding:8px 14px calc(26px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;background:linear-gradient(170deg,rgba(14,36,92,.97),rgba(4,14,42,.98));
 border:1px solid rgba(255,255,255,.14);border-bottom:0;box-shadow:0 -20px 60px rgba(0,8,40,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.sheet.open .panel{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.28);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh-head h3{margin:0;font-size:23px}.sh-head small{color:var(--mute);font-size:12.5px}
.x2{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-size:15px;transition:transform .4s var(--spring),background .3s}
.x2:hover{background:rgba(255,255,255,.18)}
.legend{font-size:12px;color:var(--mute);margin:2px 4px 4px}
.fd{margin-top:12px;border-radius:24px;padding:12px;background:linear-gradient(135deg,rgba(var(--c),.17),rgba(255,255,255,.03));border:1px solid rgba(var(--c),.32);animation:rise .7s var(--spring) both;animation-delay:calc(var(--i)*80ms)}
.fh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fh b{font-size:18px;display:block}.fh small{display:block;color:var(--mute);font-size:12px}
.fr{display:flex;gap:10px;align-items:stretch;margin-top:7px}
.ft{width:46px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.ft small{font-size:10.5px;color:var(--mute);line-height:1.15;text-align:center}
.fc{flex:1;min-width:0;display:grid;gap:6px;align-content:start}
.fc .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ftile{position:relative;border-radius:16px;padding:8px 10px;background:linear-gradient(135deg,rgba(var(--c),.32),rgba(var(--c),.08));border:1px solid rgba(var(--c),.42);min-width:0}
.ftile.hasg{padding-right:26px}
.ftile b{display:block;font-size:14.5px;line-height:1.2}
.ftile .em{font-size:15px;margin-right:5px}
.ftile small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;overflow-wrap:anywhere;line-height:1.25}
.ftile .tag{display:inline-block;margin-top:4px;font-size:10.5px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.1)}
.sgb{position:absolute;top:6px;right:6px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:rgba(255,255,255,.16)}
.ftile.nil{background:rgba(255,255,255,.03);border-style:dashed;border-color:rgba(255,255,255,.12);color:var(--mute);display:grid;place-items:center;min-height:46px}
.fl{margin:8px 0 2px 56px;text-align:center;font-size:12.5px;color:#ffc98a;background:rgba(255,176,84,.12);border:1px dashed rgba(255,176,84,.45);border-radius:14px;padding:5px}
.emp{color:var(--mute);text-align:center;padding:14px 6px;font-size:14px}

/* страницы заметок */
.ph{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.ph h2{margin:0;font-size:28px;letter-spacing:-.01em}
.db{display:flex;align-items:center;gap:8px;border-radius:24px;padding:6px;margin-bottom:12px}
.db>button.nb{width:46px;height:46px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:15px;transition:transform .4s var(--spring),background .3s;position:relative;z-index:1}
.dl{flex:1;text-align:center;position:relative;z-index:1}
.dl b{display:block;font-size:18px}.dl small{display:block;color:var(--mute);font-size:12.5px}
.tdy{margin-top:2px;padding:3px 11px;border-radius:99px;font-size:11.5px;background:rgba(255,205,110,.9);color:#2a1a00}
.card{border-radius:26px;padding:14px;margin-bottom:12px}
.card>*{position:relative;z-index:1}
.ct{font-size:13px;color:var(--mute);margin:0 2px 10px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.06em}
.pick{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px 8px 8px;border-radius:20px;background:rgba(var(--c),.14);border:1px solid rgba(var(--c),.4);font-size:17px;text-align:left;transition:background .35s,border-color .35s,transform .4s var(--spring)}
.pick .pt{flex:1;min-width:0}
.pick .pe{--c:inherit}
.drop{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .55s var(--ease),margin-top .35s,opacity .4s}
.drop>div{overflow:hidden;min-height:0}
.drop.open{grid-template-rows:1fr;margin-top:10px;opacity:1}
.newsub{display:flex;gap:8px;margin-top:10px}
.inp{width:100%;flex:1;min-width:0;padding:13px 15px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);outline:0;font-size:16px;transition:border-color .3s,box-shadow .3s,background .3s}
.inp::placeholder{color:rgba(226,240,255,.45)}
.inp:focus{border-color:rgba(var(--c),.9);box-shadow:0 0 0 3px rgba(var(--c),.22);background:rgba(255,255,255,.1)}
textarea.inp{resize:none;min-height:92px;line-height:1.4;display:block}
.row2{display:flex;gap:8px;margin-top:10px}
.add{padding:0 18px;min-height:48px;border-radius:18px;background:linear-gradient(135deg,rgba(var(--c),1),rgba(var(--c),.7));color:#06142f;font-size:15px;box-shadow:inset 1px 1px 0 rgba(255,255,255,.5),0 8px 20px rgba(var(--c),.4);white-space:nowrap;transition:transform .4s var(--spring)}
.add.wide{width:100%;margin-top:10px}
.it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:18px;background:rgba(var(--c),.1);border:1px solid rgba(var(--c),.22);margin-top:8px}
.it:first-of-type{margin-top:0}
.il{flex:1;min-width:0;font-size:16px}
.iv{font-size:20px;color:rgb(var(--c));font-variant-numeric:tabular-nums}
.x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);font-size:12px;color:var(--mute);flex:none;transition:transform .4s var(--spring),background .3s}
.x:hover{background:rgba(255,90,110,.35);color:#fff}
.note{align-items:flex-start}
.note .il{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.4}
.note small{display:block;color:var(--mute);font-size:11.5px;margin-bottom:3px}
.sr{margin-top:10px}
.sr .l{display:flex;align-items:center;gap:10px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin:7px 2px 0 46px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,rgba(var(--c),.6),rgb(var(--c)));box-shadow:0 0 12px rgba(var(--c),.7);transition:width 1s var(--ease)}
.grand{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:13px 16px;border-radius:20px;background:linear-gradient(135deg,rgba(255,205,110,.28),rgba(255,140,100,.12));border:1px solid rgba(255,205,110,.45)}
.grand span{font-size:16px}.grand b{font-size:34px;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff3cc,#ffb35a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:6px}
.tabs .chip{padding:5px 11px;font-size:12px;text-transform:none;letter-spacing:0}

/* Прочее */
.prog{display:flex;align-items:center;gap:14px}
.ring{width:76px;height:76px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .rb{stroke:rgba(255,255,255,.1)}
.ring .rf{stroke:url(#rg);transition:stroke-dashoffset 1s var(--ease);filter:drop-shadow(0 0 5px rgba(120,225,200,.7))}
.pgt{flex:1}.pgt b{display:block;font-size:26px}.pgt small{color:var(--mute);font-size:13px}
.pct{font-size:20px;color:#7be8c8;flex:none}
.gh{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px;font-size:15px}
.gh small{color:var(--mute);font-size:12.5px}
.tk{display:flex;align-items:center;gap:12px;padding:9px 12px 9px 9px;border-radius:20px;background:rgba(var(--c),.09);border:1px solid rgba(var(--c),.22);margin-bottom:8px;transition:background .5s,border-color .5s,transform .4s var(--spring);animation:rise .7s var(--spring) both;animation-delay:calc(var(--i)*45ms)}
.tk .tt{flex:1;min-width:0;font-size:16px}
.tk .tt span{position:relative;display:inline-block;transition:opacity .4s}
.tk .tt span::after{content:"";position:absolute;left:0;right:0;top:56%;height:2px;border-radius:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.tk small{display:block;color:var(--mute);font-size:12px}
.tk.done{background:rgba(var(--c),.2);border-color:rgba(var(--c),.55)}
.tk.done .tt span{opacity:.55}.tk.done .tt span::after{transform:scaleX(1)}
.chk{width:34px;height:34px;border-radius:50%;flex:none;border:2.5px solid rgba(var(--c),.85);display:grid;place-items:center;transition:background .4s,box-shadow .4s,transform .5s var(--spring)}
.chk svg{width:20px;height:20px;fill:none;stroke:#06142f;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.chk path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .5s var(--ease) .08s}
.tk.done .chk{background:rgb(var(--c));box-shadow:0 0 16px rgba(var(--c),.8),inset 1px 1px 0 rgba(255,255,255,.5);transform:scale(1.06)}
.tk.done .chk path{stroke-dashoffset:0}

/* новое */
.now.glass{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px 14px;margin:-4px 0 14px;background:linear-gradient(135deg,rgba(var(--c),.34),rgba(var(--c),.08));border-color:rgba(var(--c),.5)}
.now>*{position:relative;z-index:1}.now .m b{font-size:17px}.now .m small{font-size:14px;color:#e2edfb}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
li.cur .tx{box-shadow:0 0 0 2px rgba(var(--c),.95),0 0 24px rgba(var(--c),.6)}li.cur .tm{color:#fff}
.cx .tx{opacity:.5}.cx .tx b{text-decoration:line-through}
.stk{font-size:12.5px;color:#ffc98a;white-space:nowrap;flex:none}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.two2>div{border-radius:18px;padding:10px 12px;background:rgba(var(--c),.14);border:1px solid rgba(var(--c),.35);font-size:12.5px;color:var(--mute)}
.two2 b{display:block;color:#e2edfb;font-size:16px;margin-top:2px}
select.inp{appearance:none;-webkit-appearance:none}select.inp option{color:#06142f}
.num,.ic{width:92px;flex:none;padding:9px 10px;text-align:center;border-radius:14px}.ic{width:76px}
.it.hw.dn .il{opacity:.55}
#alarm{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(1,5,20,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#alarm.on{display:grid}.al{text-align:center;padding:30px 34px;border-radius:30px;background:linear-gradient(160deg,rgba(40,105,225,.5),rgba(10,30,80,.9));border:1px solid rgba(255,255,255,.25)}
.al b{display:block;font-size:56px;margin-bottom:4px}.al small{display:block;color:var(--mute);margin-bottom:18px;font-size:15px}
</style>

    <div class="legend">🔴 красная · ⚪ белая неделя (пары по чередованию) · 👥 вся группа</div>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7be8c8"/><stop offset="1" stop-color="#5cbeff"/></linearGradient></defs></svg>

<script>
// ===== НАСТРОЙКИ (можно править) =====
const TZ='Asia/Yekaterinburg';
const dnOf=(y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/864e5);
const START=dnOf(2026,10,7), ANCHOR=dnOf(2026,10,5), ANCHOR_NUM=true; // ANCHOR — понедельник недели-числителя
const HOL=[dnOf(2026,11,4)], PRE=[dnOf(2026,11,3)];
let SLEEP=480, DRESS=15;                                     // минуты
let WALK_FAR=20, WAIT=10, WALK_NEAR=10, RIDE=30, BUFFER=10, HOME=40;
const LINEUP=true, USUAL_BED=150;                              // 02:30 в минутах
// ===== ЗВОНКИ =====
const B={
 mon:['09:00-10:00','10:10-11:40','12:30-13:50','14:10-15:30','15:40-17:00','17:20-18:40','18:50-20:10'],
 std:['08:30-10:00','10:10-11:40','12:30-13:50','14:10-15:30','15:40-17:00','17:20-18:40','18:50-20:10'],
 thu:['08:30-10:00','10:10-11:40','12:30-13:50','14:30-15:30','15:40-17:00','17:20-18:40','18:50-20:10'],
 pre:['08:30-09:40','09:50-11:00','11:40-12:50','13:00-14:10','14:20-15:30','15:40-16:50','17:00-18:10'],
 sat:['08:30-09:50','10:00-11:20','11:40-12:50','13:00-14:20','14:30-15:50','16:00-17:20','17:30-18:50']};
// ===== ПАРЫ: [пара, предмет, преподаватель, аудитория, подгруппа(0=все), неделя(num/den)] =====
const S={
 0:[[1,'РМП','Басыров','59',1],[2,'РМП','Басыров','59',1],[2,'ЗБД','Басырова','60',2],[3,'РМП','Басыров','59',1],[3,'ЗБД','Басырова','60',2],[4,'ЗБД','Басырова','60',2]],
 1:[[1,'РПМ','Басыров','69',1],[2,'Числ. методы','Земскова','54',0],[3,'Физкультура','Соловьева','с/з',0]],
 2:[[1,'РМП','Басырова','60',2],[2,'РМП','Басырова','60',2],[3,'РМП','Басырова','60',2],[4,'РМП','Басыров','66',1],[5,'РМП','Басыров','66',1]],
 3:[[1,'ЗБД','Басырова','60',2],[2,'Числ. методы','Земскова','77',0,'den'],[3,'ЗБД','Басыров','69',1],[4,'ЗБД','Басыров','69',1],[5,'ЗБД','Басыров','69',1,'num']],
 4:[[2,'Числ. методы','Земскова','73',0],[3,'ЗБД','Басыров','66',1],[3,'Англ. яз.','Гайнуллина','42',2],[4,'ЗБД','Басыров','66',1],[4,'РПМ','Басырова','60',2],[5,'ЗБД','Басыров','66',1],[5,'РМП','Басырова','60',2,'den']],
 5:[[1,'РМП','Басырова','60',2],[2,'РМП','Басырова','60',2],[3,'РМП','Басыров','59',1],[4,'ЗБД','Басыров','59',1]]};

// ===== Логика =====
const DAYS=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const AB=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MON=['','января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const st={sg:2,way:'far',flip:false,sel:null,tik:60,bf:20,sh:40,hyg:'auto',q:{teeth:1,hair:1,face:1,style:1},walk:{},open:null,
  page:'sched',td:null,psub:null,pval:'',ival:'',popen:false,ptot:'day',fv:0,newId:null};
try{Object.assign(st,JSON.parse(localStorage.getItem('po31')||'{}'));st.sel=null;st.open=null}catch(e){}
const save=()=>{try{localStorage.setItem('po31',JSON.stringify({sg:st.sg,way:st.way,flip:st.flip,tik:st.tik,bf:st.bf,sh:st.sh,hyg:st.hyg,q:st.q,walk:st.walk}))}catch(e){}};
const wd=dn=>(dn+3)%7;
const tm=s=>{const[h,m]=s.split(':');return +h*60+ +m};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dobj=dn=>new Date(dn*864e5);
const dlabel=dn=>dobj(dn).getUTCDate()+' '+MON[dobj(dn).getUTCMonth()+1];
const room=r=>/^\d+$/.test(r)?'ауд. '+r:r;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function now(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'}).formatToParts(new Date());const g=t=>+p.find(x=>x.type===t).value;return{dn:dnOf(g('year'),g('month'),g('day')),min:g('hour')*60+g('minute')}}
const isNum=dn=>{const mon=dn-wd(dn);const n=Math.floor((mon-ANCHOR)/7);return ((n%2===0)===ANCHOR_NUM)!==st.flip};
const bellKind=dn=>{const w=wd(dn);return w===5?'sat':PRE.includes(dn)?'pre':w===0?'mon':w===3?'thu':'std'};
const lessons=dn=>{if(dn<START||wd(dn)===6||HOL.includes(dn))return[];const num=isNum(dn);
  return (S[wd(dn)]||[]).filter(l=>(l[4]===0||l[4]===st.sg)&&(!l[5]||(l[5]==='num')===num)).sort((a,b)=>a[0]-b[0])};
const bell=(dn,p)=>B[bellKind(dn)][p-1].split('-').map(tm);
const findDay=(from,dir=1)=>{let d=Math.max(from,dir>0?START:0);for(let i=0;i<60;i++,d+=dir){if(d<START)return null;if(lessons(d).length)return d}return null};
function defDay(){const n=now();const ls=lessons(n.dn);
  if(ls.length&&n.min<bell(n.dn,ls[ls.length-1][0])[1]+HOME)return n.dn;
  return findDay(n.dn+1)||START}

let EAT=20;
const HYG_PARTS=[['teeth','Зубы',4],['hair','Голова',5],['face','Умывание, крем',15],['style','Причёска',10]];
const effHyg=first=>st.hyg==='auto'?(first<720?'quick':'shower'):st.hyg;      // пары раньше 12:00 — без душа
const hygMin=first=>effHyg(first)==='shower'?st.sh:HYG_PARTS.reduce((a,p)=>a+(st.q[p[0]]?p[2]:0),0);

// ===== палитра, значки, перемены =====
const COL={sleep:'129,140,255',wake:'255,205,110',bf:'255,166,112',hyg:'78,222,200',dress:'244,134,204',go:'92,190,255',arrive:'172,150,255',
 les:'84,148,255',lunch:'255,176,84',gap:'150,170,210',club:'200,170,255',home:'104,230,170',eat:'255,138,122',walk:'126,222,126',chores:'150,180,240'};
const SUBJ={'РМП':'84,148,255','ЗБД':'178,120,255','РПМ':'64,206,232','Числ. методы':'110,220,150','Физкультура':'255,128,120','Англ. яз.':'250,206,92'};
const SUBJ_EM={'РМП':'💻','ЗБД':'🗂️','РПМ':'🛠️','Числ. методы':'🧮','Физкультура':'🏃','Англ. яз.':'🇬🇧'};
const PAL=['255,120,140','255,170,90','250,215,90','120,225,150','80,205,235','150,160,255','200,140,255','255,140,200'];
const DCOL=['255,128,140','255,176,90','250,215,90','110,222,150','84,200,235','176,136,255'];
const LUNCH={std:[2,5],mon:[2,5],thu:[2,5],pre:[2],sat:[]};      // после каких пар обед
const E=(t,k,n,i,o={})=>({t,k,n,i:(k!=='les'&&((dat.cfg||{}).ev||{})[k])||i,c:o.c||COL[k]||COL.gap,s:o.s||'',e:o.e,p:o.p||0,m:o.m,x:o.x||''});
const mins=x=>x+' мин';
function gapEv(dn,a,b){
  const k=bellKind(dn),w=wd(dn),lun=LUNCH[k]||[],end=bell(dn,a)[1],start=bell(dn,b)[0],out=[];
  if(b-a>1){let cur=end;                                          // окно, внутри которого может быть обед
    for(const p of lun){if(p>=a&&p<b){const ls=bell(dn,p)[1],le=bell(dn,p+1)[0];
      if(ls>cur)out.push(E(cur,'gap','Окно','⏳',{s:mins(ls-cur),e:ls}));
      out.push(E(ls,'lunch','Обед','🍽️',{s:mins(le-ls),e:le}));cur=le}}
    if(start>cur)out.push(E(cur,'gap','Окно','⏳',{s:mins(start-cur),e:start}));
    return out}
  if(lun.includes(a))return [E(end,'lunch','Обед','🍽️',{s:mins(start-end),e:start})];
  if(w===3&&a===3){const c1=tm('14:00'),c2=tm('14:20');
    return [E(end,'gap','Перемена','☕',{s:mins(c1-end),e:c1}),E(c1,'club','Классный час','👥',{s:mins(c2-c1),e:c2}),E(c2,'gap','Перемена','☕',{s:mins(start-c2),e:start})]}
  return [E(end,'gap','Перемена','☕',{s:mins(start-end),e:start})];
}

function routine(dn){
  const ls=lessons(dn);if(!ls.length)return null;
  const first=bell(dn,ls[0][0])[0],last=bell(dn,ls[ls.length-1][0])[1];
  const lineup=LINEUP&&wd(dn)===0&&ls[0][0]===1;
  const arrive=(lineup?tm('08:30'):first)-BUFFER;
  const travel=st.way==='far'?WALK_FAR+WAIT+RIDE:WALK_NEAR+RIDE;
  const leave=arrive-travel,dress=leave-DRESS,hyg=dress-hygMin(first),wake=hyg-st.bf,sleep=wake-SLEEP;
  return {ls,first,last,lineup,arrive,leave,dress,hyg,wake,sleep,lie:sleep-st.tik,home:last+HOME};
}
const chips=(a,cur,items)=>'<div class="chips">'+items.map(([v,t])=>`<button class="chip${String(cur)===String(v)?' on':''}" data-a="${a}" data-v="${v}">${t}</button>`).join('')+'</div>';
function menu(k,dn,first){
  if(k.slice(0,3)==='chg')return chgMenu(dn,+k.slice(3));
  if(k==='bf')return `<div class="menu"><div class="lab">Завтрак</div>${chips('bf',st.bf,[[10,'10 мин'],[15,'15 мин'],[20,'20 мин']])}</div>`;
  if(k==='sleep')return `<div class="menu"><div class="lab">Тикток</div>${chips('tik',st.tik,[[0,'Нет'],[30,'30 мин'],[60,'1 час'],[90,'1,5 часа']])}</div>`;
  if(k==='walk')return `<div class="menu"><div class="lab">Прогулка</div>${chips('walk',st.walk[dn]||0,[[0,'Нет'],[1,'1 ч'],[2,'2 ч'],[3,'3 ч'],[4,'4 ч']])}</div>`;
  if(k==='hyg'){
    const sh=effHyg(first)==='shower';
    let h=`<div class="menu"><div class="lab">Гигиена</div>${chips('hyg',st.hyg,[['auto','Авто'],['shower','Душ'],['quick','Без душа']])}`;
    if(sh)h+=`<div class="lab" style="margin-top:10px">В душе: голова, зубы и умывание</div>`+chips('sh',st.sh,[[35,'35 мин'],[40,'40 мин']]);
    else h+='<div class="chips tg">'+HYG_PARTS.map(p=>`<button class="chip${st.q[p[0]]?' on':''}" data-a="q" data-v="${p[0]}">${p[1]} · ${p[2]}</button>`).join('')+'</div>';
    return h+`<div class="tot">${hygMin(first)} мин</div></div>`}
  return '';
}
function dayHtml(dn){
  const w=wd(dn),num=isNum(dn);
  let h=`<div class="head"><h2>${DAYS[w][0].toUpperCase()+DAYS[w].slice(1)}, ${dlabel(dn)}</h2><button class="pill" onclick="flipW()"><i class="dot ${num?'r':'w'}"></i><span style="position:relative;z-index:1">${num?'Красная':'Белая'}</span></button></div>`;
  if(dn<START)return h+'<div class="empty">🏠 Дистант</div>';
  if(w===6||HOL.includes(dn))return h+'<div class="empty">🎉 Выходной</div>';
  const r=routine(dn);
  if(!r)return h+'<div class="empty">Пар нет</div>';
  const ls=r.ls;
  h+=`<div class="sum"><div><small>Пар</small><b>${ls.length}</b></div><div><small>Начало</small><b>${fmt(r.first)}</b></div><div><small>Конец</small><b>${fmt(r.last)}</b></div></div>`;
  if(dn===now().dn)h+='<div class="now glass" id="nowbox"></div>';
  const ev=[];
  const sh=effHyg(r.first)==='shower';
  ev.push(E(r.lie,'sleep','Спать','💤',{s:r.lie<0?'вчера':'',e:st.tik?r.sleep:null,m:'sleep'}));
  ev.push(E(r.wake,'wake','Подъём','⏰'));
  ev.push(E(r.wake,'bf','Завтрак','🍴',{e:r.wake+st.bf,m:'bf'}));
  ev.push(E(r.hyg,'hyg','Гигиена',sh?'🚿':'🪥',{s:sh?'душ · голова, зубы, умывание':'без душа',e:r.dress,m:'hyg'}));
  ev.push(E(r.dress,'dress','Одевание','👕'));
  ev.push(E(r.leave,'go','Выход','🚪'));
  ev.push(E(r.arrive,'arrive','Прибытие','📍'));
  if(r.lineup)ev.push(E(tm('08:30'),'club','Линейка','📣',{s:'20 мин',e:tm('08:50')}));
  let prev=null;
  for(const l of ls){const[s,e]=bell(dn,l[0]);
    if(prev)ev.push(...gapEv(dn,prev[0],l[0]));
    ev.push(E(s,'les',l[1],SUBJ_EM[l[1]]||'📚',{c:SUBJ[l[1]]||COL.les,s:lesSub(dn,l),e,p:l[0],m:'chg'+l[0],x:(chgOf(dn,l[0])||{}).k==='c'?'cx':''}));
    prev=l}
  // вечер: дом → еда → прогулка → дела → тикток и сон (по завтрашнему подъёму)
  ev.push(E(r.home,'home','Дома','🏠'));
  const eatEnd=r.home+EAT,wk=(st.walk[dn]||0)*60,nx=routine(dn+1),off=nx?nx.lie+1440:null;
  ev.push(E(r.home,'eat','Еда','🍲',{e:eatEnd}));
  let t=eatEnd;
  const wEnd=wk?(off!=null?Math.min(t+wk,off):t+wk):null;
  ev.push(E(t,wk?'walk':'gap','Прогулка','🌳',{s:wk?'':'нет',e:wEnd,m:'walk'}));
  if(wk)t=wEnd;
  if(off==null||off>t)ev.push(E(t,'chores','Дела','📝',{e:off}));
  if(nx)ev.push(E(off,'sleep','Спать','💤',{e:st.tik?nx.sleep+1440:null,m:'sleep'}));
  return h+'<ul class="tl">'+ev.map((e,i)=>{const k=e.m;

    <div class="tot">Уведомления: ${pt}. Напоминания и звонок срабатывают, пока приложение открыто или свёрнуто и не «заснуло» — на закрытом приложении гарантий нет, поэтому держите запасной будильник в телефоне.</div>`);
  h+=cd('Ваши цифры',TIMEF.map(x=>row(x[1],x[0],cv(x[0]))).join('')+row('Душ, мин','sh',st.sh)+row('Завтрак, мин','bf',st.bf));
  h+=cd('Свои значки','<div class="lab">Предметы</div>'+allSubjects().map(s=>irow(subjEm(s),s,'data-em',s,(c.em||{})[s])).join('')+'<div class="lab" style="margin-top:10px">События дня</div>'+EVF.map(x=>irow(((c.ev||{})[x[0]])||x[2],x[1],'data-ev',x[0],(c.ev||{})[x[0]])).join('')+'<div class="tot">Пустое поле — значок по умолчанию.</div>');
  h+=cd('Резервная копия',`<div class="row2" style="margin-top:0"><button class="add" style="flex:1" data-act="export">💾 Сохранить в файл</button><button class="add" style="flex:1" data-act="import">📂 Загрузить из файла</button></div><input type="file" id="impf" accept="application/json,.json" hidden><div class="tot">Всё хранится в браузере и пропадёт при очистке данных сайта — сохраняйте копию.</div>`);
  h+=cd('Приложение',ip?'<button class="add wide" style="margin-top:0" data-act="install">📲 Установить на устройство</button>':'<div class="tot" style="margin-top:0">Установка: меню браузера → «Установить приложение» / «На экран Домой». Работает, если страница открыта по https-адресу вместе с файлами manifest.json, sw.js и иконками.</div>');
  paint('p-set',h,dir)}
function exportData(){
  const o={app:'po31',v:1,at:new Date().toISOString(),st:localStorage.getItem('po31'),data:localStorage.getItem(DK)};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));
  a.download='raspisanie-backup-'+o.at.slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function importFile(f){if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='po31'||!o.data)throw 0;JSON.parse(o.data);
    if(!confirm('Заменить текущие данные данными из файла?'))return;
    localStorage.setItem(DK,o.data);if(o.st)localStorage.setItem('po31',o.st);location.reload()}catch(e){alert('Не удалось прочитать файл резервной копии')}};
  r.readAsText(f)}
function act3(a){const k=a.dataset.act,v=a.dataset.v;
  if(k==='stat'){st.stat=v;renderPts('none')}
  else if(k==='hwadd')addHw();
  else if(k==='hwtog'){const x=dat.hw.find(h=>String(h.id)===v);if(x){x.done=x.done?0:1;saveD();renderImp('none')}}
  else if(k==='hwdel'){dat.hw=dat.hw.filter(h=>String(h.id)!==v);saveD();renderImp('none')}
  else if(k==='theme'){cfg().theme=v;saveD();applyTheme();renderSet()}
  else if(k==='nt'){const n=nc();n[v]=n[v]?0:1;if(v==='on'&&n.on)askPerm();saveD();renderSet()}
  else if(k==='perm')askPerm();
  else if(k==='test'){if(!('Notification' in window)||Notification.permission!=='granted')askPerm();else notify('🔔 Проверка','Уведомления работают','test')}
  else if(k==='testring'){const n=now();ring(n.min)}
  else if(k==='export')exportData();
  else if(k==='import')$('impf').click();
  else if(k==='install'&&ip){ip.prompt();ip=null}}
document.addEventListener('change',e=>{const t=e.target,c=cfg(),v=(t.value||'').trim();
  if(t.dataset&&t.dataset.cfg){const k=t.dataset.cfg;
    if(k==='sh'||k==='bf'){const x=parseInt(v);if(x>=0&&x<=300){st[k]=x;save()}}
    else if(v==='')delete c[k];else c[k]=Math.max(0,Math.min(900,parseFloat(v)||0));
    saveD();applyCfg();render('none')}
  else if(t.dataset&&t.dataset.em!==undefined){c.em=c.em||{};const s=[...v].slice(0,2).join('');if(s)c.em[t.dataset.em]=s;else delete c.em[t.dataset.em];saveD();applyCfg();render('none');renderSet()}
  else if(t.dataset&&t.dataset.ev!==undefined){c.ev=c.ev||{};const s=[...v].slice(0,2).join('');if(s)c.ev[t.dataset.ev]=s;else delete c.ev[t.dataset.ev];saveD();render('none');renderSet()}
  else if(t.id==='impf'){importFile(t.files[0]);t.value=''}});

applyCfg();applyTheme();render();initAlerts();
</script>
